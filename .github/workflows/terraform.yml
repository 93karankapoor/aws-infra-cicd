name: Terraform Deployment

on:
  pull_request:
    branches:
      - main
      - dev
  
  push:
    branches:
      - main
      - dev

  release:
    types:
      - published

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    env:
      TFLINT_VERSION: 0.59.1
      TFSEC_VERSION: 1.33.0
      CHECKOV_VERSION: 2.0.0

    environment:
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        name: Setup Terraform

      - name: Setup tflint
        run: |
          curl -sSL "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" -o tflint.zip
          unzip tflint.zip && sudo mv tflint /usr/local/bin
          tflint --version

      - name: Terraform fmt check
        run: |
          cd env/dev
          terraform fmt -write=false -diff -check

      - name: Terraform init
        run: |
          cd env/dev
          terraform init

      - name: Run tflint
        run: |
          cd env/dev
          tflint --init
          tflint
      
      - name: tfsec scan (security scanning)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./env/dev
          format: sarif
          soft_fail: true
          additional_args: --force-all-dirs --out tfsec.sarif

      - name: Upload tfsec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec.sarif

      - name: Run checkov (policy-as-code)
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: env/dev
          soft_fail: true
          download_external_modules: true

      - name: Upload checkov results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Run terraform validate
        run: |
          cd env/dev
          terraform validate

      - name: Create plan
        id: plan
        run: |
          cd env/dev
          terraform plan -lock=false -input=false -out=tfplan.txt
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: env/dev/tfplan.txt